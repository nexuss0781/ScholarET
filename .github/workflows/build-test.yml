name: Build and Test

on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config python3 zip file

      - name: Build MuPDF 1.23.11
        run: |
          git clone --depth 1 --branch 1.23.11 --shallow-submodules --recurse-submodules \
            https://github.com/ArtifexSoftware/mupdf.git /tmp/mupdf-1.23.11
          cd /tmp/mupdf-1.23.11
          test -f thirdparty/lcms2/include/lcms2mt.h
          make -j$(nproc) shared=yes HAVE_X11=no HAVE_GLUT=no HAVE_CURL=no
          sudo make install shared=yes HAVE_X11=no HAVE_GLUT=no HAVE_CURL=no
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Build
        env:
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
          LD_LIBRARY_PATH: /usr/local/lib
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Download grade 12 books
        run: |
          mkdir -p data
          while read -r url; do
            [ -z "$url" ] && continue
            [[ "$url" == \#* ]] && continue
            filename=$(basename "$url")
            echo "downloading $filename"
            curl -L -o "data/$filename" "$url"
          done < script/grade12_books.txt
          echo "--- downloaded ---"
          ls -la data/

      - name: Extract all books
        env:
          LD_LIBRARY_PATH: /usr/local/lib
        run: |
          set -o pipefail
          mkdir -p out_test
          while read -r url; do
            [ -z "$url" ] && continue
            [[ "$url" == \#* ]] && continue
            filename=$(basename "$url")
            name="${filename%.pdf}"
            outdir="out_test/$name"
            echo "=== Extracting $filename ==="
            ./build/extract --in "data/$filename" --out "$outdir" --threads 0 2>&1 | tee "extract-$name.log"
            echo "---HEAD $name---"
            head -40 "$outdir/book.md"
            echo "---STATS $name---"
            echo "md bytes: $(wc -c < "$outdir/book.md")"
            echo "png files: $(find "$outdir/assets" -name '*.png' 2>/dev/null | wc -l)"
            echo "empty pngs: $(find "$outdir/assets" -name '*.png' -size 0 2>/dev/null | wc -l)"
          done < script/grade12_books.txt
          test -d out_test

      - name: Package all outputs
        if: always()
        run: |
          cd out_test
          zip -r ../scholar-extract-sample.zip .

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scholar-extract-sample
          path: scholar-extract-sample.zip

      - name: Publish to Hugging Face
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub --quiet
          python - <<'PY'
          from huggingface_hub import HfApi
          import os

          repo_id = "Nexuss0781/Ethiopian-Student-Curriculem"
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.create_repo(repo_id=repo_id, repo_type="dataset", exist_ok=True, private=False)

          api.upload_folder(
              folder_path="out_test",
              path_in_repo="",
              repo_id=repo_id,
              repo_type="dataset",
          )
          print("Published all books to https://huggingface.co/datasets/" + repo_id)
          PY

      - name: Check LaTeX quality
        if: always()
        run: |
          echo "---DIAG---"
          for log in extract-*.log; do
            echo "=== $log ==="
            grep 'SCHOLARET-DIAG' "$log" || true
          done
          echo "---PER BOOK STATS---"
          for md in out_test/*/book.md; do
            name=$(basename "$(dirname "$md")")
            replacement=$(grep -o $'\xef\xbf\xbd' "$md" | wc -l)
            display_math=$(grep -c '^\$\$' "$md" || true)
            echo "$name: replacement_chars=$replacement display_math_blocks=$((display_math / 2))"
          done
