name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config python3 zip file

      - name: Build MuPDF 1.23.11
        run: |
          git clone --depth 1 --branch 1.23.11 --shallow-submodules --recurse-submodules \
            https://github.com/ArtifexSoftware/mupdf.git /tmp/mupdf-1.23.11
          cd /tmp/mupdf-1.23.11
          test -f thirdparty/lcms2/include/lcms2mt.h
          make -j$(nproc) shared=yes HAVE_X11=no HAVE_GLUT=no HAVE_CURL=no
          sudo make install shared=yes HAVE_X11=no HAVE_GLUT=no HAVE_CURL=no
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Build extractor
        env:
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
          LD_LIBRARY_PATH: /usr/local/lib
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Copy libmupdf.so next to extractor
        run: |
          cp /usr/local/lib/libmupdf.so build/ 2>/dev/null || true
          ls -la build/

      - name: Upload extractor binary + libmupdf.so
        uses: actions/upload-artifact@v4
        with:
          name: extractor-binary
          path: |
            build/extract
            build/libmupdf.so

  extract:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - book: "Agriculture"
            file: "Agriculture.pdf"
            slug: "Agriculture"
          - book: "Biology"
            file: "Biology.pdf"
            slug: "Biology"
          - book: "Chemistry"
            file: "Chemistry.pdf"
            slug: "Chemistry"
          - book: "Economics"
            file: "Economics.pdf"
            slug: "Economics"
          - book: "English"
            file: "English.pdf"
            slug: "English"
          - book: "Geography"
            file: "Geography.pdf"
            slug: "Geography"
          - book: "History"
            file: "History.pdf"
            slug: "History"
          - book: "Information Technology"
            file: "Information%20Technology.pdf"
            slug: "Information_Technology"
          - book: "Mathematics"
            file: "Mathematics.pdf"
            slug: "Mathematics"
          - book: "Physics"
            file: "Physics.pdf"
            slug: "Physics"
          - book: "Amharic"
            file: "Amharic.pdf"
            slug: "Amharic"
    steps:
      - uses: actions/checkout@v4

      - name: Download extractor binary
        uses: actions/download-artifact@v4
        with:
          name: extractor-binary
          path: build/

      - name: Make extractor executable
        run: chmod +x build/extract

      - name: Download one book (with PDF integrity verification)
        run: |
          mkdir -p data
          url="https://github.com/ethcocoders/Digital-Library/raw/main/Source/System/Grade%2012/${{ matrix.file }}"
          out="data/${{ matrix.file }}"
          # Retry until we get a complete PDF (starts with %PDF and ends with %%EOF).
          # Some source downloads arrive truncated (no %%EOF), which would fail
          # extraction for the wrong reason.
          ok=0
          for attempt in 1 2 3 4 5; do
            echo "download attempt $attempt for ${{ matrix.book }}"
            curl -L --retry 2 --retry-delay 5 -o "$out" "$url" 2>/dev/null || true
            head_magic=$(head -c 5 "$out" 2>/dev/null)
            tail_magic=$(tail -c 12 "$out" 2>/dev/null | tr -d '\n\r')
            if [ "$head_magic" = "%PDF" ] && echo "$tail_magic" | grep -q '%%EOF'; then
              echo "${{ matrix.book }} downloaded OK ($(wc -c < "$out") bytes)"
              ok=1
              break
            fi
            echo "${{ matrix.book }} download incomplete (head='$head_magic' tail='$tail_magic'), retrying..."
            sleep 3
          done
          if [ "$ok" != "1" ]; then
            echo "ERROR: ${{ matrix.book }} could not be downloaded completely after 5 attempts" >&2
            exit 1
          fi

      - name: Extract text + embedded figures (C++ extractor, images inline)
        env:
          LD_LIBRARY_PATH: build/:$LD_LIBRARY_PATH
        run: |
          outdir="out_test/${{ matrix.slug }}"
          mkdir -p "$outdir"
          echo "=== Extracting ${{ matrix.book }} (text + embedded figures inline) ==="
          set +e
          ./build/extract --in "data/${{ matrix.file }}" --out "$outdir" --threads 1 2>&1 | tee "extract-${{ matrix.slug }}.log"
          extract_exit=$?
          set -e
          echo "Extractor exit code: $extract_exit"
          if [ -f "$outdir/book.md" ]; then
            echo "md bytes: $(wc -c < "$outdir/book.md")"
            echo "png files: $(find "$outdir/assets" -name '*.png' 2>/dev/null | wc -l)"
          else
            echo "WARNING: book.md not produced for ${{ matrix.book }}"
            cat "extract-${{ matrix.slug }}.log" 2>/dev/null || true
          fi

      - name: Upload per-book output (preserves <Book>/ folder)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: book-${{ matrix.slug }}
          path: out_test/${{ matrix.slug }}/
          if-no-files-found: warn

  publish:
    needs: extract
    runs-on: ubuntu-latest
    # Publish on pushes to main and on manual dispatch so the full pipeline can be
    # validated end-to-end without waiting for a push.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download all per-book outputs into their own folders
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for book in Agriculture Biology Chemistry Economics English Geography History Information_Technology Mathematics Physics Amharic; do
            echo "=== downloading $book ==="
            id=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/nexuss0781/ScholarET/actions/runs/${{ github.run_id }}/artifacts" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(next((a['id'] for a in d['artifacts'] if a['name']=='book-$book'),''))")
            if [ -z "$id" ]; then echo "no artifact for $book"; continue; fi
            mkdir -p "out_test/$book"
            curl -sL -H "Authorization: Bearer $GH_TOKEN" \
              -o "/tmp/book-$book.zip" \
              "https://api.github.com/repos/nexuss0781/ScholarET/actions/artifacts/${id}/zip"
            unzip -o -q "/tmp/book-$book.zip" -d "out_test/$book"
            rm -f "/tmp/book-$book.zip"
          done
          echo "=== staged tree ==="
          find out_test -maxdepth 2 -type f | sort | head -50

      - name: Publish all to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub --quiet
          python - <<'PY'
          from huggingface_hub import HfApi
          import os

          repo_id = "Nexuss0781/Ethiopian-Student-Curriculem"
          api = HfApi(token=os.environ["HF_TOKEN"])

          # Wipe the stale dataset content (leaked binary, root book.md, fragments).
          api.delete_repo(repo_id=repo_id, repo_type="dataset", missing_ok=True)
          api.create_repo(repo_id=repo_id, repo_type="dataset", exist_ok=True, private=False)

          api.upload_folder(
              folder_path="out_test",
              path_in_repo="",
              repo_id=repo_id,
              repo_type="dataset",
          )
          print("Published all books to https://huggingface.co/datasets/" + repo_id)
          PY

  audit:
    needs: publish
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download all per-book outputs into their own folders
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for book in Agriculture Biology Chemistry Economics English Geography History Information_Technology Mathematics Physics Amharic; do
            id=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/nexuss0781/ScholarET/actions/runs/${{ github.run_id }}/artifacts" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(next((a['id'] for a in d['artifacts'] if a['name']=='book-$book'),''))")
            if [ -z "$id" ]; then echo "no artifact for $book"; continue; fi
            mkdir -p "out_test/$book"
            curl -sL -H "Authorization: Bearer $GH_TOKEN" \
              -o "/tmp/book-$book.zip" \
              "https://api.github.com/repos/nexuss0781/ScholarET/actions/artifacts/${id}/zip"
            unzip -o -q "/tmp/book-$book.zip" -d "out_test/$book"
            rm -f "/tmp/book-$book.zip"
          done

      - name: Audit each book.md separately
        run: |
          mkdir -p audit-reports
          for dir in out_test/*/; do
            base=$(basename "$dir")
            md="$dir/book.md"
            if [ -f "$md" ]; then
              echo "=== auditing $base ==="
              python3 script/audit_output.py "$md" --sample-lines 8 | tee "audit-reports/$base.txt"
            else
              echo "=== no book.md for $base, skipping ==="
            fi
          done
          cat audit-reports/*.txt > audit.txt 2>/dev/null || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit.txt
          if-no-files-found: warn
