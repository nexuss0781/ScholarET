name: Build and Test

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config python3 zip file

      - name: Build MuPDF 1.23.11
        run: |
          git clone --depth 1 --branch 1.23.11 --shallow-submodules --recurse-submodules \
            https://github.com/ArtifexSoftware/mupdf.git /tmp/mupdf-1.23.11
          cd /tmp/mupdf-1.23.11
          test -f thirdparty/lcms2/include/lcms2mt.h
          make -j$(nproc) shared=yes HAVE_X11=no HAVE_GLUT=no HAVE_CURL=no
          sudo make install shared=yes HAVE_X11=no HAVE_GLUT=no HAVE_CURL=no
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Build extractor
        env:
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
          LD_LIBRARY_PATH: /usr/local/lib
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Copy libmupdf.so next to extractor
        run: |
          cp /usr/local/lib/libmupdf.so build/ 2>/dev/null || true
          ls -la build/

      - name: Upload extractor binary + libmupdf.so
        uses: actions/upload-artifact@v4
        with:
          name: extractor-binary
          path: |
            build/extract
            build/libmupdf.so

  extract:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        book: [
          {name: "Agriculture", file: "Agriculture.pdf"},
          {name: "Biology", file: "Biology.pdf"},
          {name: "Chemistry", file: "Chemistry.pdf"},
          {name: "Economics", file: "Economics.pdf"},
          {name: "English", file: "English.pdf"},
          {name: "Geography", file: "Geography.pdf"},
          {name: "History", file: "History.pdf"},
          {name: "Information Technology", file: "Information%20Technology.pdf"},
          {name: "Mathematics", file: "Mathematics.pdf"},
          {name: "Physics", file: "Physics.pdf"}
        ]
        # Amharic removed: extractor hangs indefinitely on its Ge'ez-script PDF.
        # Re-add once the infinite loop is diagnosed and fixed.
    steps:
      - uses: actions/checkout@v4

      - name: Download extractor binary
        uses: actions/download-artifact@v4
        with:
          name: extractor-binary
          path: build/

      - name: Make extractor executable
        run: chmod +x build/extract

      - name: Download one book
        run: |
          mkdir -p data
          curl -L -o "data/${{ matrix.book.name }}.pdf" \
            "https://github.com/ethcocoders/Digital-Library/raw/main/Source/System/Grade%2012/${{ matrix.book.file }}"

      - name: Extract one book into its own folder
        env:
          LD_LIBRARY_PATH: build/:$LD_LIBRARY_PATH
        run: |
          outdir="${{ matrix.book.name }}"
          mkdir -p "$outdir"
          echo "=== Extracting ${{ matrix.book.name }} ==="
          set +e
          ./build/extract --in "data/${{ matrix.book.name }}.pdf" --out "$outdir" --threads 0 2>&1 | tee "extract-${{ matrix.book.name }}.log"
          extract_exit=$?
          set -e
          echo "Extractor exit code: $extract_exit"
          if [ -f "$outdir/book.md" ]; then
            echo "---HEAD---"
            head -40 "$outdir/book.md"
            echo "---STATS---"
            echo "md bytes: $(wc -c < "$outdir/book.md")"
            echo "png files: $(find "$outdir/assets" -name '*.png' 2>/dev/null | wc -l)"
            echo "empty pngs: $(find "$outdir/assets" -name '*.png' -size 0 2>/dev/null | wc -l)"
          else
            echo "WARNING: book.md not produced for ${{ matrix.book.name }}"
            cat "extract-${{ matrix.book.name }}.log" 2>/dev/null || true
          fi

      - name: Upload per-book output
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: book-${{ matrix.book.name }}
          path: |
            ${{ matrix.book.name }}/book.md
          if-no-files-found: warn

      - name: Upload per-book assets (if any)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.book.name }}
          path: ${{ matrix.book.name }}/assets/*.png
          if-no-files-found: warn

  publish:
    needs: extract
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download all per-book outputs
        run: |
          mkdir -p out_test
          for book in Agriculture Biology Chemistry Economics English Geography History "Information Technology" Mathematics Physics; do
            gh run download ${{ github.run_id }} --name "book-${book}" --dir out_test --clobber 2>/dev/null || echo "no book artifact for $book"
            gh run download ${{ github.run_id }} --name "assets-${book}" --dir out_test --clobber 2>/dev/null || echo "no assets artifact for $book"
          done

      - name: Publish all to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub --quiet
          python - <<'PY'
          from huggingface_hub import HfApi
          import os

          repo_id = "Nexuss0781/Ethiopian-Student-Curriculem"
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.create_repo(repo_id=repo_id, repo_type="dataset", exist_ok=True, private=False)

          api.upload_folder(
              folder_path="out_test",
              path_in_repo="",
              repo_id=repo_id,
              repo_type="dataset",
          )
          print("Published all books to https://huggingface.co/datasets/" + repo_id)
          PY

  audit:
    needs: publish
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download all per-book outputs
        run: |
          mkdir -p out_test
          for book in Agriculture Biology Chemistry Economics English Geography History "Information Technology" Mathematics Physics; do
            gh run download ${{ github.run_id }} --name "book-${book}" --dir out_test --clobber 2>/dev/null || echo "no book artifact for $book"
            gh run download ${{ github.run_id }} --name "assets-${book}" --dir out_test --clobber 2>/dev/null || echo "no assets artifact for $book"
          done

      - name: Audit each book.md separately
        run: |
          mkdir -p audit-reports
          for dir in out_test/*/; do
            base=$(basename "$dir")
            md="$dir/book.md"
            if [ -f "$md" ]; then
              echo "=== auditing $base ==="
              python3 script/audit_output.py "$md" --sample-lines 8 | tee "audit-reports/$base.txt"
            else
              echo "=== no book.md for $base, skipping ==="
            fi
          done
          cat audit-reports/*.txt > audit.txt 2>/dev/null || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit.txt
          if-no-files-found: warn
