name: Build and Test

on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config python3 zip file

      - name: Build MuPDF 1.23.11
        run: |
          git clone --depth 1 --branch 1.23.11 --shallow-submodules --recurse-submodules \
            https://github.com/ArtifexSoftware/mupdf.git /tmp/mupdf-1.23.11
          cd /tmp/mupdf-1.23.11
          test -f thirdparty/lcms2/include/lcms2mt.h
          make -j$(nproc) shared=yes HAVE_X11=no HAVE_GLUT=no HAVE_CURL=no
          sudo make install shared=yes HAVE_X11=no HAVE_GLUT=no HAVE_CURL=no
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Build
        env:
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
          LD_LIBRARY_PATH: /usr/local/lib
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Download sample
        run: |
          mkdir -p data
          curl -L -o data/Physics.pdf "https://github.com/ethcocoders/Digital-Library/raw/main/Source/System/Grade%2012/Physics.pdf"

      - name: Extract
        env:
          LD_LIBRARY_PATH: /usr/local/lib
        run: |
          set -o pipefail
          ./build/extract --in data/Physics.pdf --out out_test --threads 0 2>&1 | tee extract.log
          echo "---HEAD---"
          head -40 out_test/book.md
          echo "---STATS---"
          echo "md bytes: $(wc -c < out_test/book.md)"
          echo "png files: $(find out_test/assets -name '*.png' | wc -l)"
          echo "png bytes: $(du -sb out_test/assets | cut -f1)"
          echo "empty pngs: $(find out_test/assets -name '*.png' -size 0 | wc -l)"
          sample_png=$(find out_test/assets -name '*.png' | sort | head -1)
          echo "sample png: $sample_png"
          file "$sample_png"
          test -s out_test/book.md
          test "$(find out_test/assets -name '*.png' | wc -l)" -gt 0
          test "$(find out_test/assets -name '*.png' -size 0 | wc -l)" -eq 0
          file "$sample_png" | grep -Eq 'PNG image data, [0-9]+ x [0-9]+'

      - name: Package output
        if: always()
        run: |
          cd out_test
          zip -r ../scholar-extract-sample.zip book.md assets

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scholar-extract-sample
          path: scholar-extract-sample.zip

      - name: Publish to GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: extracted-sample
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" scholar-extract-sample.zip --clobber
          else
            gh release create "$TAG" scholar-extract-sample.zip \
              --title "Extracted sample (book.md + assets)" \
              --notes "Generated by the Build and Test workflow from data/Physics.pdf."
          fi

      - name: Check LaTeX quality
        if: always()
        run: |
          echo "---DIAG---"
          grep 'SCHOLARET-DIAG' extract.log || true
          math_spans=$(grep -oP '(?<=math spans: )\d+' extract.log || echo 0)
          sup_spans=$(grep -oP '(?<=superscript spans: )\d+' extract.log || echo 0)
          sub_spans=$(grep -oP '(?<=subscript spans: )\d+' extract.log || echo 0)
          glyph_fixed=$(grep -oP '(?<=glyphs recovered: )\d+' extract.log || echo 0)
          replacement=$(grep -o $'\xef\xbf\xbd' out_test/book.md | wc -l)
          display_math=$(grep -c '^\$\$' out_test/book.md || true)
          echo "book.md replacement chars: $replacement"
          echo "book.md display math blocks: $((display_math / 2))"
          echo "---LATEX SAMPLES---"
          echo "[display math]"
          grep -A1 -m3 '^\$\$' out_test/book.md || true
          echo "[superscripts]"
          grep -oE '.{0,18}\^\{[^}]{0,24}' out_test/book.md | head -4 || true
          echo "[radicals]"
          grep -oE '.{0,18}\\sqrt\{.{0,40}' out_test/book.md | head -3 || true
          echo "[math spans]"
          grep -oE '.{0,18}\$[^$]{1,40}\$' out_test/book.md | head -5 || true
          test "$math_spans" -gt 100
          test "$sup_spans" -gt 100
          test "$sub_spans" -gt 100
          test "$display_math" -gt 0
          test "$glyph_fixed" -gt 20
          test "$replacement" -eq 0