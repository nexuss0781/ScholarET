name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config python3 zip file tesseract-ocr tesseract-ocr-eng

      - name: Build MuPDF 1.23.11
        run: |
          git clone --depth 1 --branch 1.23.11 --shallow-submodules --recurse-submodules \
            https://github.com/ArtifexSoftware/mupdf.git /tmp/mupdf-1.23.11
          cd /tmp/mupdf-1.23.11
          test -f thirdparty/lcms2/include/lcms2mt.h
          make -j$(nproc) shared=yes HAVE_X11=no HAVE_GLUT=no HAVE_CURL=no
          sudo make install shared=yes HAVE_X11=no HAVE_GLUT=no HAVE_CURL=no
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Build extractor
        env:
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
          LD_LIBRARY_PATH: /usr/local/lib
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Copy libmupdf.so next to extractor
        run: |
          cp /usr/local/lib/libmupdf.so build/ 2>/dev/null || true
          ls -la build/

      - name: Upload extractor binary + libmupdf.so
        uses: actions/upload-artifact@v4
        with:
          name: extractor-binary
          path: |
            build/extract
            build/libmupdf.so

  extract:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - book: "Agriculture"
            file: "Agriculture.pdf"
            slug: "Agriculture"
          - book: "Biology"
            file: "Biology.pdf"
            slug: "Biology"
          - book: "Chemistry"
            file: "Chemistry.pdf"
            slug: "Chemistry"
          - book: "Economics"
            file: "Economics.pdf"
            slug: "Economics"
          - book: "English"
            file: "English.pdf"
            slug: "English"
          - book: "Geography"
            file: "Geography.pdf"
            slug: "Geography"
          - book: "History"
            file: "History.pdf"
            slug: "History"
          - book: "Information Technology"
            file: "Information%20Technology.pdf"
            slug: "Information_Technology"
          - book: "Mathematics"
            file: "Mathematics.pdf"
            slug: "Mathematics"
          - book: "Physics"
            file: "Physics.pdf"
            slug: "Physics"
    steps:
      - uses: actions/checkout@v4

      - name: Download extractor binary
        uses: actions/download-artifact@v4
        with:
          name: extractor-binary
          path: build/

      - name: Make extractor executable
        run: chmod +x build/extract

      - name: Download one book (with PDF integrity verification)
        run: |
          mkdir -p data
          url="https://github.com/ethcocoders/Digital-Library/raw/main/Source/System/Grade%2012/${{ matrix.file }}"
          out="data/${{ matrix.file }}"
          ok=0
          for attempt in 1 2 3 4 5; do
            echo "download attempt $attempt for ${{ matrix.book }}"
            curl -L --retry 2 --retry-delay 5 -o "$out" "$url" 2>/dev/null || true
            head_magic=$(head -c 4 "$out" 2>/dev/null)
            tail_magic=$(tail -c 12 "$out" 2>/dev/null | tr -d '\n\r')
            if [ "$head_magic" = "%PDF" ] && echo "$tail_magic" | grep -q '%%EOF'; then
              echo "${{ matrix.book }} downloaded OK ($(wc -c < "$out") bytes)"
              ok=1
              break
            fi
            echo "${{ matrix.book }} download incomplete (head='$head_magic' tail='$tail_magic'), retrying..."
            sleep 3
          done
          if [ "$ok" != "1" ]; then
            echo "ERROR: ${{ matrix.book }} could not be downloaded completely after 5 attempts" >&2
            exit 1
          fi

      - name: Extract text + embedded figures (C++ extractor, images inline)
        env:
          LD_LIBRARY_PATH: build/:$LD_LIBRARY_PATH
        run: |
          outdir="out_test/${{ matrix.slug }}"
          mkdir -p "$outdir"
          echo "=== Extracting ${{ matrix.book }} (text + embedded figures inline) ==="
          set +e
          ./build/extract --in "data/${{ matrix.file }}" --out "$outdir" --threads 1 2>&1 | tee "extract-${{ matrix.slug }}.log"
          extract_exit=$?
          set -e
          echo "Extractor exit code: $extract_exit"
          if [ -f "$outdir/book.md" ]; then
            echo "md bytes: $(wc -c < "$outdir/book.md")"
            echo "png files: $(find "$outdir/assets" -name '*.png' 2>/dev/null | wc -l)"
          else
            echo "WARNING: book.md not produced for ${{ matrix.book }}"
            cat "extract-${{ matrix.slug }}.log" 2>/dev/null || true
          fi

      - name: Clean extracted Markdown (hyphenation, bullets, LaTeX artifacts)
        run: |
          outdir="out_test/${{ matrix.slug }}"
          if [ -f "$outdir/book.md" ]; then
            echo "=== Cleaning markdown for ${{ matrix.book }} ==="
            python3 script/clean_markdown.py "$outdir/book.md"
          fi

      - name: Upload book directly to Hugging Face (final location)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          outdir="out_test/${{ matrix.slug }}"
          if [ ! -f "$outdir/book.md" ]; then
            echo "ERROR: no book.md for ${{ matrix.book }}, skipping HF upload"
            exit 0
          fi
          pip install huggingface_hub --quiet
          python - <<'PY'
          from huggingface_hub import HfApi
          import os

          repo_id = "Nexuss0781/Ethiopian-Student-Curriculem"
          book = "${{ matrix.book }}"
          api = HfApi(token=os.environ["HF_TOKEN"])

          # Upload directly to final location {book}/
          api.upload_folder(
              folder_path=os.path.abspath("out_test/${{ matrix.slug }}"),
              path_in_repo=book,
              repo_id=repo_id,
              repo_type="dataset",
          )
          print(f"Uploaded {book} to {book}/ on HF")
          PY

  publish:
    needs: extract
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Publish all to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub requests --quiet
          python - <<'PY'
          from huggingface_hub import HfApi
          import os
          import time
          import requests

          repo_id = "Nexuss0781/Ethiopian-Student-Curriculem"
          api = HfApi(token=os.environ["HF_TOKEN"])

          books = ["Agriculture", "Biology", "Chemistry", "Economics", "English",
                   "Geography", "History", "Information_Technology", "Mathematics", "Physics"]

          headers = {}
          if os.environ.get("HF_TOKEN"):
              headers["Authorization"] = f"Bearer {os.environ['HF_TOKEN']}"

          # Wait for extract jobs' HF uploads to propagate, then verify each book
          for attempt in range(30):
              all_ok = True
              for book in books:
                  url = f"https://huggingface.co/datasets/{repo_id}/resolve/main/{book}/book.md"
                  try:
                      r = requests.head(url, headers=headers, timeout=10)
                      if r.status_code != 200:
                          all_ok = False
                          break
                  except Exception:
                      all_ok = False
                      break
              if all_ok:
                  print(f"All {len(books)} books verified on HF after attempt {attempt + 1}/30")
                  break
              print(f"Waiting for books to propagate... attempt {attempt + 1}/30")
              time.sleep(10)
          else:
              print("WARNING: Not all books verified after 5 minutes")

          print(f"Published all books to https://huggingface.co/datasets/{repo_id}")
          PY

  audit:
    needs: publish
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download all per-book outputs from HF for auditing
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub --quiet
          python - <<'PY'
          from huggingface_hub import HfApi
          import os

          repo_id = "Nexuss0781/Ethiopian-Student-Curriculem"
          api = HfApi(token=os.environ["HF_TOKEN"])

          books = ["Agriculture", "Biology", "Chemistry", "Economics", "English",
                   "Geography", "History", "Information_Technology", "Mathematics", "Physics"]

          # List all files once
          all_files = api.list_repo_files(repo_id=repo_id, repo_type="dataset")

          os.makedirs("out_test", exist_ok=True)
          for book in books:
              book_dir = f"out_test/{book}"
              os.makedirs(book_dir, exist_ok=True)
              prefix = f"{book}/"
              book_files = [f for f in all_files if f.startswith(prefix)]
              downloaded = 0
              for f in book_files:
                  if f.endswith("book.md") or f.endswith(".png"):
                      try:
                          api.hf_hub_download(
                              repo_id=repo_id,
                              repo_type="dataset",
                              filename=f,
                              local_dir="out_test",
                              local_dir_use_symlinks=False,
                          )
                          downloaded += 1
                      except Exception as e:
                          print(f"  ERROR downloading {f}: {e}")
              print(f"Downloaded {book}: {downloaded} files")
          PY

      - name: Audit each book.md separately
        run: |
          mkdir -p audit-reports
          for dir in out_test/*/; do
            base=$(basename "$dir")
            md="$dir/book.md"
            if [ -f "$md" ]; then
              echo "=== auditing $base ==="
              python3 script/audit_output.py "$md" --sample-lines 8 | tee "audit-reports/$base.txt"
            else
              echo "=== no book.md for $base, skipping ==="
            fi
          done
          cat audit-reports/*.txt > audit.txt 2>/dev/null || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit.txt
          if-no-files-found: warn
