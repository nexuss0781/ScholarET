name: Publish Ethiopian Curriculum Books to Hugging Face

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Extraction run containing all 19 successful worker artifacts
        type: string
        required: true
        default: "38950708216"
  workflow_call:
    inputs:
      run_id:
        description: Extraction run containing all 19 successful worker artifacts
        type: string
        required: true
    secrets:
      HF_TOKEN:
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-ethiopian-curriculum-books
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish all 94 books
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v4

      - name: Check secret and source artifacts
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN" || { echo 'Set the HF_TOKEN repository Actions secret.' >&2; exit 1; }
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid source run ID.' >&2; exit 1; }
          gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source-run.json
          gh api --paginate --slurp "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > source-artifacts.json
          python3 - <<'PY'
          import json, os, re
          run = json.load(open('source-run.json'))
          if run['repository']['full_name'] != os.environ['REPOSITORY']:
              raise SystemExit('Source run belongs to another repository.')
          if run['path'] != '.github/workflows/extract-grade-books.yml':
              raise SystemExit('Source run is not the ScholarET grade-book extractor.')
          if run['status'] != 'completed' and str(run['id']) != os.environ['GITHUB_RUN_ID']:
              raise SystemExit('Source extraction run must be completed.')
          sha = run['head_sha']
          if not re.fullmatch('[0-9a-f]{40}', sha):
              raise SystemExit('Invalid source commit SHA.')
          artifacts = [a for page in json.load(open('source-artifacts.json')) for a in page['artifacts'] if a['name'].startswith('scholaret-grade-worker-')]
          expected = {f'scholaret-grade-worker-{i:02d}' for i in range(1, 20)}
          if len(artifacts) != 19 or {a['name'] for a in artifacts} != expected or any(a['expired'] for a in artifacts):
              raise SystemExit('All 19 unexpired worker artifacts are required.')
          print(f"Found 19 worker artifacts; compressed bytes: {sum(a['size_in_bytes'] for a in artifacts)}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'source_sha={sha}\n')
          PY
          mkdir -p source-inventory
          for file in source_book_inventory.json pdf_worker_assignments.json; do
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$REPOSITORY/contents/data/$file?ref=$(jq -r .head_sha source-run.json)" \
              > "source-inventory/$file"
          done

      - name: Free space for extracted image assets
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h "$GITHUB_WORKSPACE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned publishing SDK
        run: python -m pip install 'huggingface_hub==0.36.2'

      - name: Run pipeline and publisher tests
        run: python -m unittest discover -s tests -v

      - name: Download extraction outputs inside Actions
        uses: actions/download-artifact@v4
        with:
          pattern: scholaret-grade-worker-*
          path: worker-zips
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}

      - name: Validate archives and publish organized Markdown and assets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: '1'
          PYTHONUTF8: '1'
          PYTHONUNBUFFERED: '1'
          SOURCE_RUN_ID: ${{ inputs.run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          python scripts/publish_hf_dataset.py \
            --inventory source-inventory/source_book_inventory.json \
            --archive-dir worker-zips \
            --staging-dir hf-dataset \
            --repo-id Nexuss0781/Ethiopian-Curriculum-Books \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-sha "$SOURCE_SHA" \
            --remove-archives-after-extraction
          printf '## Published dataset\n\n[Open Ethiopian-Curriculum-Books](https://huggingface.co/datasets/Nexuss0781/Ethiopian-Curriculum-Books)\n\nSource extraction run: `%s` at `%s`.\n' \
            "$SOURCE_RUN_ID" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve validation and publication metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huggingface-publication-report
          path: |
            hf-dataset/README.md
            hf-dataset/metadata/
          if-no-files-found: ignore
          retention-days: 30
