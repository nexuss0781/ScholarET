name: Extract Biology Canon (Grades 9-12, first 10 pages)

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages to extract per book"
        required: false
        default: "10"
  push:
    paths:
      - "scripts/extract_biology_canon.py"
      - ".github/workflows/extract-biology-canon.yml"

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight PDF extractor
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymupdf

      - name: Extract first pages in parallel and build canon
        env:
          PAGES: ${{ inputs.pages || '10' }}
        run: |
          set -euo pipefail
          python scripts/extract_biology_canon.py \
            --out-dir out/biology_canon \
            --pages "$PAGES" \
            --workers 4 | tee run.log

      - name: Show report
        if: always()
        run: |
          echo "---- report.json ----"
          cat out/biology_canon/report.json || true
          echo "---- canon preview ----"
          head -n 120 out/biology_canon/biology_grade9-12_first10_canon.md || true

      - name: Upload canon and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biology-grade9-12-canon
          path: |
            out/biology_canon/**
            run.log
          if-no-files-found: warn
