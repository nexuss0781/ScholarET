name: Smart Biology Extraction (Quality-first, 20-way parallel)

on:
  workflow_dispatch:

jobs:
  extract:
    name: Extract G${{ matrix.grade }} P${{ matrix.page }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - { grade: "9", page: 1 }
          - { grade: "9", page: 2 }
          - { grade: "9", page: 3 }
          - { grade: "9", page: 4 }
          - { grade: "9", page: 5 }
          - { grade: "9", page: 6 }
          - { grade: "9", page: 7 }
          - { grade: "9", page: 8 }
          - { grade: "9", page: 9 }
          - { grade: "9", page: 10 }
          - { grade: "10", page: 1 }
          - { grade: "10", page: 2 }
          - { grade: "10", page: 3 }
          - { grade: "10", page: 4 }
          - { grade: "10", page: 5 }
          - { grade: "10", page: 6 }
          - { grade: "10", page: 7 }
          - { grade: "10", page: 8 }
          - { grade: "10", page: 9 }
          - { grade: "10", page: 10 }
          - { grade: "11", page: 1 }
          - { grade: "11", page: 2 }
          - { grade: "11", page: 3 }
          - { grade: "11", page: 4 }
          - { grade: "11", page: 5 }
          - { grade: "11", page: 6 }
          - { grade: "11", page: 7 }
          - { grade: "11", page: 8 }
          - { grade: "11", page: 9 }
          - { grade: "11", page: 10 }
          - { grade: "12", page: 1 }
          - { grade: "12", page: 2 }
          - { grade: "12", page: 3 }
          - { grade: "12", page: 4 }
          - { grade: "12", page: 5 }
          - { grade: "12", page: 6 }
          - { grade: "12", page: 7 }
          - { grade: "12", page: 8 }
          - { grade: "12", page: 9 }
          - { grade: "12", page: 10 }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: smart-pdf-pip-v1-${{ runner.os }}-${{ hashFiles('scripts/smart_pdf_engine.py') }}
          restore-keys: |
            smart-pdf-pip-v1-${{ runner.os }}-

      - name: Cache source PDFs
        uses: actions/cache@v4
        with:
          path: .cache/smart_pdfs
          key: smart-bio-pdfs-v1

      - name: Install quality extraction dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymupdf docling

      - name: Extract page (quality-first)
        run: |
          set -euo pipefail
          mkdir -p .cache/smart_pdfs out/pages
          python scripts/smart_pdf_engine.py \
            --grade "${{ matrix.grade }}" \
            --page "${{ matrix.page }}" \
            --out-dir out/pages \
            --cache-dir .cache/smart_pdfs

      - name: Upload page result
        uses: actions/upload-artifact@v4
        with:
          name: page-g${{ matrix.grade }}-p${{ matrix.page }}
          path: out/pages/grade${{ matrix.grade }}_p*.*
          if-no-files-found: error

  assemble:
    name: Assemble canon
    runs-on: ubuntu-latest
    needs: extract
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all page artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: page-g*-p*
          path: collected/pages
          merge-multiple: true

      - name: Assemble single canon
        run: |
          set -euo pipefail
          mkdir -p out/final
          python scripts/assemble_biology_canon.py \
            --input-dir collected/pages \
            --out out/final/biology_grade9-12_first10_smart_canon.md \
            --report-out out/final/smart_extract_report.json
          echo "---- report summary ----"
          python -c "import json; r=json.load(open('out/final/smart_extract_report.json')); print('pages', r['page_count']); [print(p['grade'], p['page'], p['method'], p['quality_score'], p.get('warnings')) for p in r['pages']]"
          echo "---- canon preview ----"
          head -n 120 out/final/biology_grade9-12_first10_smart_canon.md || true

      - name: Upload final processed canon (result only)
        uses: actions/upload-artifact@v4
        with:
          name: biology-grade9-12-smart-canon
          path: |
            out/final/biology_grade9-12_first10_smart_canon.md
            out/final/smart_extract_report.json
          if-no-files-found: error
